spring:
  application:
    name: source-learning-consumer
  main:
    banner-mode: "off"
    web-application-type: none

learning:
  provider-url: dubbo://127.0.0.1:20880?serialization=hessian2
  call-count: 3
  scenario: baseline
  retry-override: -1
  startup-delay-ms: 0
  frame-probe: false

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n"
